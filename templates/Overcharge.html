<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Overcharge</title>
    <link rel="stylesheet" type="text/css" href="./static/bootstrap.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:600&display=swap"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/a81368914c.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />

    <link rel="stylesheet" type="text/css" href="./static/style2.css" />
  </head>

  <body class="bodyHome">
    <div class="row hednav">
        <div class="col-2 d-flex justify-content-start">
        <a href="/scam"><i  class="fa-solid fa-circle-arrow-left ms-3"></i></a>
        </div>
        <div class="col-10 all_center">
            <span class="hedtx2">Bill Generated by AI</span>
        </div>
    </div>

    <div class="row">
      <div class="col-12 mt-5">
       
        <form action="/UploadIMG" method="POST" enctype="multipart/form-data" class="widthmax">
           
            <div class="row mt-5">
              <div class="d-flex justify-content-center imagePreview">
                <label for="imageuploder">
                  <div class="boxfreamimg">
                    {% if filename3 %}
                    <img
                      id="output"
                      src="{{ url_for('static', filename=filename3) }}"
                      alt=""
                      class="imageupload imganimation"
                    />
                    {% endif %}
                    {% if filename2 %}
                    <img
                      id="output"
                      src="{{ url_for('static', filename=filename2) }}"
                      alt=""
                      class="imageupload"
                    />
                    {% endif %}
                  </div>
                </label>
                <input
                  onchange="loadFile(event);"
                  name="uploadImage"
                  accept="image/*"
                  type="file"
                  id="imageuploder"
                  style="display: none; visibility: none"
                  required
                />
              </div>
            </div>

            <div class="row d-flex justify-content-center mt-5">
              <div class="col-12 d-flex justify-content-center">
                <button type="submit" class="hover_process">Process</button>
              </div>
            </div>
  
            <div class="row d-flex justify-content-center mt-4">
              <div class="col-12 centerbox">
                {% if lablename %}
                <div class="boxdetails mt-4 mb-4">
                  <span id="mllabel" class="statu">{{lablename}}</span>
                </div>
                {% endif %}
              </div>
            </div>

          </form>



 

      </div>
    </div>
    <script
      type="text/javascript"
      src="http://ajax.googleapis.com/ajax/libs/jquery/1.5/jquery.min.js"
    ></script>
    <script type="text/javascript" src="./static/script2.js"></script>
    <script>
      var loadFile = function (event) {
        var output = document.getElementById("output");
        output.src = URL.createObjectURL(event.target.files[0]);
        output.onload = function () {
          URL.revokeObjectURL(output.src); // free memory
          output.classList.remove('imganimation');
        };
      };
    </script>
  </body>
</html>
